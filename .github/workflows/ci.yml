                  ensure_clang_glibc_cfg(dest)
              print(f"installed {executable}")
          PY
          compiler_of() {
            case "$1" in
              clang-glibc) printf '%s\n' /root/.local/toolchain/clang-glibc/bin/clang++ ;;
              gcc-glibc) printf '%s\n' /root/.local/toolchain/gcc-glibc/bin/x86_64-unknown-linux-gnu-g++ ;;
              clang-musl) printf '%s\n' /root/.local/toolchain/clang-musl/bin/x86_64-unknown-linux-musl-clang++ ;;
              gcc-musl) printf '%s\n' /root/.local/toolchain/gcc-musl/bin/x86_64-unknown-linux-musl-g++ ;;
              *) echo "unknown uarch compiler: $1" >&2; exit 1 ;;
            esac
          }
          if [[ "${{ matrix.toolchain }}" == *-musl ]]; then
            sudo ln -sf "/root/.local/toolchain/${{ matrix.toolchain }}/x86_64-unknown-linux-musl/sysroot/usr/lib/libc.so" /lib/ld-musl-x86_64.so.1
          fi

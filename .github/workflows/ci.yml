            -DUARCH_BUILD_BENCHES=OFF \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          cmake --build "${RUNNER_TEMP}/uarch-build" --target uarch_detect --parallel 2
          cmake --install "${RUNNER_TEMP}/uarch-build"
          echo "CMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/.deps" >> "${GITHUB_ENV}"
      - name: Sync the CLI environment
        run: uv sync --locked --directory scripts/cli
      - name: Sanitizer tests
        run: |
          if [[ -r /proc/sys/kernel/io_uring_disabled && "$(cat /proc/sys/kernel/io_uring_disabled)" != "0" ]]; then
            sudo sysctl -w kernel.io_uring_disabled=0
          fi
          ulimit -l unlimited 2>/dev/null || true
          ./uring test --preset "${{ matrix.preset }}"
      - name: Verify installed CMake package consumer
        run: |
          set -euo pipefail
          case "${LIBURING_UARCH_COMPILER}" in
            clang-glibc) compiler=/root/.local/toolchain/clang-glibc/bin/clang++ ;;
            gcc-glibc) compiler=/root/.local/toolchain/gcc-glibc/bin/x86_64-unknown-linux-gnu-g++ ;;
            clang-musl) compiler=/root/.local/toolchain/clang-musl/bin/x86_64-unknown-linux-musl-clang++ ;;
            gcc-musl) compiler=/root/.local/toolchain/gcc-musl/bin/x86_64-unknown-linux-musl-g++ ;;
          esac
          rm -rf /tmp/liburing-install /tmp/liburing-consumer /tmp/liburing-consumer-build
          cmake --install "build/${{ matrix.preset }}" --prefix /tmp/liburing-install
          mkdir -p /tmp/liburing-consumer
          cat <<'EOF' > /tmp/liburing-consumer/CMakeLists.txt
          cmake_minimum_required(VERSION 3.30)
          project(liburing_consumer LANGUAGES CXX)
          set(CMAKE_CXX_SCAN_FOR_MODULES OFF)
          find_package(liburing CONFIG REQUIRED)
          add_executable(consumer main.cc)
          target_link_libraries(consumer PRIVATE liburing::liburing)
          EOF
          cat <<'EOF' > /tmp/liburing-consumer/main.cc
          #include <liburing/liburing.hpp>
          int main() {
            liburing::ring::ScriptedRing ring(8);
            return ring.Params().sq_entries == 8U ? 0 : 1;
          }
          EOF
          cmake -S /tmp/liburing-consumer -B /tmp/liburing-consumer-build -G Ninja \
            -DCMAKE_CXX_COMPILER="${compiler}" \
            -DCMAKE_PREFIX_PATH="/tmp/liburing-install;${CMAKE_PREFIX_PATH}"
          cmake --build /tmp/liburing-consumer-build

